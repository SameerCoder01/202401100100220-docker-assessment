services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  backend:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER in .env}/fest-backend:1.0.0
    environment:
      REGNO: ${REGNO:?Set REGNO in .env}
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    networks: [web, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://localhost:5000/api/health',timeout=2)); raise SystemExit(0 if h['database'] else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT:?Set PORT in .env}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
networks:
  web:
  data:
volumes:
  pgdata:
